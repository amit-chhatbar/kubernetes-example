apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: newapp:apps/Deployment:default/rolling-deployment
  name: rolling-deployment
  namespace: default
spec:
  replicas: 10
  selector:
    matchLabels:
      app: rolling-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: rolling-app
    spec:
      containers:
        - image: nginx:1.25
          name: app
          ports:
            - containerPort: 80
